
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE SSC 2K27 RICS</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#000;color:white;min-height:100vh}
button,input{font:inherit}
#login{height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at top,#512080,#000 65%)}
.login-box{width:100%;max-width:380px;text-align:center;background:#171717;padding:30px 22px;border:1px solid #333;border-radius:22px}
.logo{font-size:35px;margin-bottom:15px}
.login-box h2{margin-bottom:10px}
.login-box p{color:#aaa;margin-bottom:20px;font-size:13px}
input{width:100%;padding:14px;background:#252525;color:white;border:1px solid #333;border-radius:12px;margin:7px 0;outline:none}
button{border:0;cursor:pointer}
.gradient{background:linear-gradient(45deg,#833ab4,#e1306c,#fd1d1d,#fcb045);color:white;font-weight:bold;border-radius:12px;padding:14px;width:100%;margin-top:10px}
#app{display:none;max-width:700px;margin:auto;min-height:100vh;border-left:1px solid #222;border-right:1px solid #222;padding-bottom:75px}
header{height:65px;padding:0 17px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #222;position:sticky;top:0;background:#080808;z-index:2}
header h2{font-size:19px}
.online{color:#00df83;font-size:12px}
.welcome{padding:22px 17px}
.welcome p{color:#999;font-size:13px;margin-top:7px}
.tabs{display:flex;gap:10px;padding:0 15px 15px}
.tabs button{background:#242424;color:white;padding:10px 16px;border-radius:20px}
.tabs button.active{background:linear-gradient(45deg,#833ab4,#e1306c)}
.chat-info{padding:16px;border-top:1px solid #222;border-bottom:1px solid #222}
.chat-info p{color:#999;font-size:12px;margin-top:5px}
#messages{height:calc(100dvh - 265px);min-height:300px;overflow-y:auto;padding:15px}
.msg{display:flex;gap:10px;margin-bottom:17px}
.avatar{width:39px;height:39px;min-width:39px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(45deg,#833ab4,#fd1d1d,#fcb045);font-weight:bold}
.content{max-width:80%;background:#202020;border-radius:5px 15px 15px 15px;padding:10px 13px;overflow-wrap:anywhere}
.content b{font-size:13px;color:#e9a8ff}
.content small{font-size:10px;color:#888;margin-left:7px}
.content p{font-size:14px;margin-top:5px;line-height:1.4}
.sender{position:sticky;bottom:0;background:#090909;padding:12px;display:flex;gap:8px;border-top:1px solid #252525}
.sender input{margin:0;border-radius:25px}
.sender button{width:55px;min-width:55px;border-radius:50%;background:linear-gradient(45deg,#833ab4,#e1306c);color:white;font-size:19px}
#status{font-size:11px;color:#999;text-align:center;padding:7px}
#profile{display:none;padding:25px 18px}
#profile p{margin:15px 0;color:#bbb}
#profile button{margin-top:15px}
</style>
</head>

<body>

<section id="login">
<div class="login-box">
<div class="logo">📸</div>
<h2>THE SSC 2K27 RICS</h2>
<p>Connect with your school friends 💜</p>
<input id="loginName" placeholder="Your Full Name" maxlength="35">
<input id="loginId" placeholder="Your School ID" maxlength="8">
<button class="gradient" onclick="login()">ENTER COMMUNITY →</button>
<p id="loginStatus" style="margin-top:15px"></p>
</div>
</section>

<main id="app">
<header>
<h2>THE SSC 2K27 RICS</h2>
<span class="online">● Community</span>
</header>

<div class="welcome">
<h2>Welcome, <span id="welcomeName"></span> 👋</h2>
<p>Your school. Your friends. Your memories.</p>
</div>

<div class="tabs">
<button class="active" onclick="showPage('chat',this)">💬 Chat</button>
<button onclick="showPage('profile',this)">👤 Profile</button>
</div>

<section id="chat">
<div class="chat-info">
<h3>🌍 Public Group Chat</h3>
<p>THE SSC 2K27 RICS · Everyone can chat</p>
</div>
<div id="status">Connecting to chat...</div>
<div id="messages"></div>
<div class="sender">
<input id="message" placeholder="Message your friends..." maxlength="1000">
<button onclick="sendMessage()">➤</button>
</div>
</section>

<section id="profile">
<h2>Your Profile 👤</h2>
<p>Name: <b id="profileName"></b></p>
<p>School ID: <b id="profileId"></b></p>
<button class="gradient" onclick="logout()">LOG OUT</button>
</section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  databaseURL:"https://new-file-42e55-default-rtdb.firebaseio.com/"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const messagesRef = db.ref("messages");

let currentUser = null;
let chatListener = null;

function login(){
 const name=document.getElementById("loginName").value.trim();
 const id=document.getElementById("loginId").value.trim();

 if(!name || !/^\d{8}$/.test(id)){
  document.getElementById("loginStatus").textContent="Enter name and valid 8-digit ID";
  return;
 }

 currentUser={name:name,id:id};
 localStorage.setItem("ricsUser",JSON.stringify(currentUser));
 openApp();
}

function openApp(){
 document.getElementById("login").style.display="none";
 document.getElementById("app").style.display="block";

 document.getElementById("welcomeName").textContent=currentUser.name;
 document.getElementById("profileName").textContent=currentUser.name;
 document.getElementById("profileId").textContent=currentUser.id;

 startChat();
}

function startChat(){
 const box=document.getElementById("messages");
 box.innerHTML="";

 if(chatListener) messagesRef.off("child_added",chatListener);

 chatListener=snapshot=>{
  const data=snapshot.val();
  if(!data || typeof data.text!=="string")return;

  const div=document.createElement("div");
  div.className="msg";

  const avatar=document.createElement("div");
  avatar.className="avatar";
  avatar.textContent=(data.name||"?").charAt(0).toUpperCase();

  const content=document.createElement("div");
  content.className="content";

  const user=document.createElement("b");
  user.textContent=data.name||"Student";

  const id=document.createElement("small");
  id.textContent=data.schoolId||"";

  const message=document.createElement("p");
  message.textContent=data.text;

  content.append(user,id,message);
  div.append(avatar,content);
  box.appendChild(div);
  box.scrollTop=box.scrollHeight;
 };

 messagesRef.limitToLast(100).on("child_added",chatListener,error=>{
  document.getElementById("status").textContent="Database error: "+error.message;
 });

 messagesRef.limitToLast(100).once("value")
 .then(()=>document.getElementById("status").textContent="🟢 Connected · Latest 100 messages")
 .catch(error=>document.getElementById("status").textContent="Connection error: "+error.message);
}

function sendMessage(){
 if(!currentUser)return;

 const input=document.getElementById("message");
 const text=input.value.trim();

 if(!text)return;

 input.disabled=true;

 messagesRef.push({
  name:currentUser.name,
  schoolId:currentUser.id,
  text:text,
  time:firebase.database.ServerValue.TIMESTAMP
 })
 .then(()=>{input.value="";})
 .catch(error=>alert("Message failed: "+error.message))
 .finally(()=>input.disabled=false);
}

document.getElementById("message").addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});

function showPage(page,button){
 document.getElementById("chat").style.display=page==="chat"?"block":"none";
 document.getElementById("profile").style.display=page==="profile"?"block":"none";
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
 button.classList.add("active");
}

function logout(){
 localStorage.removeItem("ricsUser");
 location.reload();
}

try{
 const saved=JSON.parse(localStorage.getItem("ricsUser"));
 if(saved && saved.name && saved.id){
  currentUser=saved;
  openApp();
 }
}catch(e){
 localStorage.removeItem("ricsUser");
}
</script>
</body>
</html>
